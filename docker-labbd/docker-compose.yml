services:
  db:
    build: .
    container_name: labbd_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: labbd
      POSTGRES_USER: labbd
      POSTGRES_PASSWORD:  labbd
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Volume persistente: os dados sobrevivem a 'docker compose down'
      # Use 'docker compose down -v' para apagar tudo e recarregar do zero
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbd -d labbd"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
